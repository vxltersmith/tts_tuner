paths:
  model_dir: "./data/data_correct/temp_model"
  cache_dir: "./hf_cache"
  output_dir: "./data/"
  checkpoint_dir: "./data/data_correct/temp_model"
  ckpt_dir: "./data/data_correct/temp_model"

models:
  voice_encoder: "./data/data_correct/temp_model/ve.safetensors"
  t3_checkpoint: "./data/data_correct/temp_model/t3_cfg.safetensors"
  t3_checkpoint_ru: "./data/data_correct/temp_model/t3_cfg.safetensors"
  s3gen_checkpoint: "./data/data_correct/temp_model/s3gen.safetensors"
  voice_conditional: "./data/data_correct/temp_model/conds.pt"
  tokenizer_source: "./data/data_correct/temp_model/tokenizer.json"

merge_embeddings:
  source_tokenizer: "./data/temp_model/tokenizer.json"
  checkpoint: "./data/temp_model/t3_cfg.safetensors"
  output_checkpoint: "./data/data_correct/temp_model/t3_out_cfg.safetensors"
  ipa:
    tokenizer_path: "./data/temp_model/tokenizer.json"
    lang_in: "ru"
    lang_out: "en"
  share_vocab_size: 704
  law: "harm"
  sigma_r: 0.4
  p: 3.0
  alpha: 0.25

merge_vocabs:
  tokenizer_en: "./data/data_correct/temp_model/tokenizer.json"
  tokenizer_ru: "./data/data_correct/ru_bpe_2000/tokenizer.json"
  tokenizer_output: "./data/data_correct/tokenizer.json"
  test_string: "синхрофазотрон"
  cut_vocab_offset: 18

tts:
  text_tokens_dict_size: null
  device: "cuda"

train_tokenizer:
  dataset: "Vikhrmodels/ToneSpeak"
  split: "train"
  temp_dir: "./data/temp"
  output_dir: "./data/ru_bpe_2000"
  min_frequency: 10
  cache_dir: "./hf_cache"

tokenizer:
  vocab_size: 2000
  special_tokens:
    - "[UNK]"
    - "[CLS]"
    - "[SEP]"
    - "[PAD]"

validation:
  dataset_key: "Vikhrmodels/ToneSpeak"
  whisper_model: "tiny"
  
run_tts:
  voice: "моя киса, мой котёнок!"
  output_suffix: ""
  map_location: "cpu"